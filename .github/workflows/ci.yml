name: ci

# T1
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Install the workspace dependencies
        run: devenv shell -- pnpm install --frozen-lockfile

      # 入口ごとの上限は tools/verification-time.json だけに置く
      - name: Verify (T1)
        run: |
          limit=$(jq -er '.verify.limit_seconds' tools/verification-time.json)
          status=0
          timeout --signal=TERM --kill-after=60 "$limit" devenv shell -- pnpm verify || status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::verify reached the ${limit}s limit in tools/verification-time.json"
          fi
          exit "$status"
