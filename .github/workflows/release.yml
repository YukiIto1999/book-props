name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      invocation: ${{ steps.source.outputs.invocation }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the source commit and component versions
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"
          version=$(jq -er '.version' package.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$tag" = "$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          test -s tools/release/cosign.pub
          for manifest in runtimes/obsidian/manifest.json runtimes/book-extension/manifest.json; do
            jq -e --arg version "$version" '.version == $version' "$manifest" > /dev/null
          done
          printf 'tag=%s\ncommit=%s\ninvocation=%s/%s/actions/runs/%s/attempts/%s\n' \
            "$tag" "$commit" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Install locked dependencies
        run: devenv shell -- pnpm install --frozen-lockfile

      - name: Verify and build both components
        run: devenv shell -- pnpm verify:push

      - name: Package and audit the ZIP
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          devenv --profile release shell -- pnpm package:release "$TAG" "$RUNNER_TEMP/assets"
          devenv --profile release shell -- python3 tools/scripts/audit-release.py "$RUNNER_TEMP/assets/book-props-$TAG.zip"

      - name: Upload the audited ZIP and SPDX
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-props-${{ steps.source.outputs.tag }}-candidate
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  sign:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Check out the exact source and release key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download the audited ZIP and SPDX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Sign and verify the ZIP and its provenance
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUILD_INVOCATION: ${{ needs.build.outputs.invocation }}
          COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: devenv --profile release shell -- bash tools/scripts/sign-release.sh "$RUNNER_TEMP/assets/book-props-$TAG.zip" tools/release/cosign.pub

      - name: Fix the verified asset hashes
        id: hashes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/assets"
          {
            printf 'hashes<<ASSET_HASHES\n'
            sha256sum -- SHA256SUMS "book-props-$TAG.spdx.json" "book-props-$TAG.zip" \
              "book-props-$TAG.zip.sigstore.json" "book-props-$TAG.zip.intoto.sigstore.json"
            printf 'ASSET_HASHES\n'
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-props-${{ needs.build.outputs.tag }}-signed
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Publish only after checking the uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
          ASSET_HASHES: ${{ needs.sign.outputs.hashes }}
        run: |
          cd "$RUNNER_TEMP/assets"
          printf '%s\n' "$ASSET_HASHES" | sha256sum --check --strict -
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq -e --arg tag "$TAG" 'flatten | all(.tag_name != $tag)' > /dev/null
          releases="repos/$GH_REPO/releases"
          draft=$(gh api --method POST "$releases" \
            -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="$TAG" \
            -F draft=true -F generate_release_notes=true)
          draft_id=$(jq -er '.id | numbers' <<< "$draft")
          upload_url=$(jq -er '.upload_url | strings' <<< "$draft")
          test "$upload_url" = "https://uploads.github.com/$releases/$draft_id/assets{?name,label}"
          upload_url=${upload_url%%\{*}
          assets=(SHA256SUMS "book-props-$TAG.spdx.json" "book-props-$TAG.zip"
            "book-props-$TAG.zip.sigstore.json" "book-props-$TAG.zip.intoto.sigstore.json")
          for asset in "${assets[@]}"; do
            gh api --method POST "$upload_url?name=$asset" \
              -H 'Content-Type: application/octet-stream' --input "$asset" --silent
          done
          draft=$(gh api "$releases/$draft_id")
          jq -e --arg tag "$TAG" '.draft and .tag_name == $tag' <<< "$draft" > /dev/null
          uploaded_hashes=$(jq -er '
            .assets[] | select(.state == "uploaded" and (.digest | strings | startswith("sha256:")))
            | "\(.digest | ltrimstr("sha256:"))  \(.name)"
          ' <<< "$draft")
          test "$(jq -er '.assets | length' <<< "$draft")" = "${#assets[@]}"
          diff -u <(printf '%s\n' "$ASSET_HASHES" | sort) <(printf '%s\n' "$uploaded_hashes" | sort)
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh api --method PATCH "$releases/$draft_id" -F draft=false --jq .html_url
