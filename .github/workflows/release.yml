name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the candidate source
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/scripts/release-source.sh

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Install locked dependencies
        run: devenv shell -- pnpm install --frozen-lockfile

      - name: Verify and build both components
        run: devenv shell -- pnpm verify:push

      - name: Package and audit the ZIP
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          devenv --profile release shell -- pnpm package:release "$TAG" "$RUNNER_TEMP/assets"
          devenv --profile release shell -- python3 tools/scripts/audit-release.py "$RUNNER_TEMP/assets/book-props-$TAG.zip"

      - name: Upload the audited ZIP and SPDX
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-props-${{ steps.source.outputs.tag }}-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

      - name: Record the reviewed release inputs
        env:
          TAG: ${{ steps.source.outputs.tag }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          sum=$(sha256sum < "$RUNNER_TEMP/assets/book-props-$TAG.zip")
          digest=${sum%% *}
          {
            printf '### Release candidate\n\n[Download the candidate](%s)\n\n' "$ARTIFACT_URL"
            printf "Source: \`%s\`  \nVersion: \`%s\`\n\n" "$GITHUB_SHA" "$TAG"
            printf 'Use this annotation after accepting the ZIP:\n\n'
            printf "\`book-props-release: %s/%s %s\`\n" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      candidate_hash: ${{ steps.source.outputs.candidate_hash }}
      candidate_ref: ${{ steps.source.outputs.candidate_ref }}
      invocation: ${{ steps.candidate.outputs.invocation }}
      artifact: ${{ steps.checked.outputs.artifact-id }}
    steps:
      - name: Check out the tag and default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version tag and reviewed ZIP hash
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/scripts/release-source.sh

      - name: Resolve the successful candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_RUN: ${{ steps.source.outputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ steps.source.outputs.candidate_attempt }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT" |
            jq -e --arg commit "$COMMIT" --arg branch "$DEFAULT_BRANCH" --arg repo "$REPOSITORY_ID" '
              .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/release.yml"
              and .head_sha == $commit and .head_branch == $branch
              and (.repository.id | tostring) == $repo and (.head_repository.id | tostring) == $repo
            ' > /dev/null
          printf 'invocation=%s/%s/actions/runs/%s/attempts/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CANDIDATE_RUN" "$CANDIDATE_ATTEMPT" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Download the reviewed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.candidate_run }}
          name: book-props-${{ steps.source.outputs.tag }}-candidate-${{ steps.source.outputs.candidate_attempt }}
          path: ${{ runner.temp }}/assets

      - name: Check that the downloaded ZIP is the reviewed ZIP
        env:
          TAG: ${{ steps.source.outputs.tag }}
          REVIEWED_HASH: ${{ steps.source.outputs.candidate_hash }}
        run: |
          cd "$RUNNER_TEMP/assets"
          cmp SHA256SUMS <(printf '%s  book-props-%s.zip\n' "$REVIEWED_HASH" "$TAG")
          sha256sum --check --strict SHA256SUMS

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Recheck current advisories for the reviewed SBOM
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: devenv --profile release shell -- osv-scanner scan source -L "$RUNNER_TEMP/assets/book-props-$TAG.spdx.json"

      - name: Upload the checked candidate for signing
        id: checked
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-props-${{ steps.source.outputs.tag }}-checked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  sign:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Check out the exact source and release key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download the audited ZIP and SPDX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Sign and verify the ZIP and its provenance
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          APPROVED_COMMIT: ${{ needs.prepare.outputs.commit }}
          REVIEWED_HASH: ${{ needs.prepare.outputs.candidate_hash }}
          BUILD_INVOCATION: ${{ needs.prepare.outputs.invocation }}
          BUILD_REF: ${{ needs.prepare.outputs.candidate_ref }}
          COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: devenv --profile release shell -- bash tools/scripts/sign-release.sh "$RUNNER_TEMP/assets/book-props-$TAG.zip" tools/release/cosign.pub

      - name: Fix the verified asset hashes
        id: hashes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/assets"
          {
            printf 'hashes<<ASSET_HASHES\n'
            sha256sum -- SHA256SUMS "book-props-$TAG.spdx.json" "book-props-$TAG.zip" \
              "book-props-$TAG.zip.sigstore.json" "book-props-$TAG.zip.intoto.sigstore.json"
            printf 'ASSET_HASHES\n'
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-props-${{ needs.prepare.outputs.tag }}-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  publish:
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Publish only after checking the uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
          ASSET_HASHES: ${{ needs.sign.outputs.hashes }}
        run: |
          cd "$RUNNER_TEMP/assets"
          printf '%s\n' "$ASSET_HASHES" | sha256sum --check --strict -
          tag_ref="repos/$GH_REPO/git/ref/tags/$TAG"
          test "$(gh api "$tag_ref" --jq .object.sha)" = "$TAG_OBJECT"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq -e --arg tag "$TAG" 'flatten | all(.tag_name != $tag)' > /dev/null
          releases="repos/$GH_REPO/releases"
          draft=$(gh api --method POST "$releases" \
            -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="$TAG" \
            -F draft=true -F generate_release_notes=true)
          draft_id=$(jq -er '.id | numbers' <<< "$draft")
          upload_url=$(jq -er '.upload_url | strings' <<< "$draft")
          test "$upload_url" = "https://uploads.github.com/$releases/$draft_id/assets{?name,label}"
          upload_url=${upload_url%%\{*}
          assets=(SHA256SUMS "book-props-$TAG.spdx.json" "book-props-$TAG.zip"
            "book-props-$TAG.zip.sigstore.json" "book-props-$TAG.zip.intoto.sigstore.json")
          for asset in "${assets[@]}"; do
            gh api --method POST "$upload_url?name=$asset" \
              -H 'Content-Type: application/octet-stream' --input "$asset" --silent
          done
          draft=$(gh api "$releases/$draft_id")
          jq -e --arg tag "$TAG" '.draft and .tag_name == $tag' <<< "$draft" > /dev/null
          uploaded_hashes=$(jq -er '
            .assets[] | select(.state == "uploaded" and (.digest | strings | startswith("sha256:")))
            | "\(.digest | ltrimstr("sha256:"))  \(.name)"
          ' <<< "$draft")
          test "$(jq -er '.assets | length' <<< "$draft")" = "${#assets[@]}"
          diff -u <(printf '%s\n' "$ASSET_HASHES" | sort) <(printf '%s\n' "$uploaded_hashes" | sort)
          test "$(gh api "$tag_ref" --jq .object.sha)" = "$TAG_OBJECT"
          gh api --method PATCH "$releases/$draft_id" -F draft=false --jq .html_url
