name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      zip_hash: ${{ steps.package.outputs.zip_hash }}
      build_attempt: ${{ steps.package.outputs.build_attempt }}
      hashes: ${{ steps.package.outputs.hashes }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the source and release version
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/scripts/release-source.sh

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install devenv
        run: bash .github/setup-devenv.sh

      - name: Install locked dependencies
        run: devenv shell -- pnpm install --frozen-lockfile

      - name: Verify and build both components
        run: devenv shell -- pnpm verify:push

      - name: Package and audit the ZIP
        id: package
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          devenv --profile release shell -- pnpm package:release "$TAG" "$RUNNER_TEMP/assets"
          devenv --profile release shell -- python3 tools/scripts/audit-release.py "$RUNNER_TEMP/assets/book-props-$TAG.zip"
          read -r digest _ < "$RUNNER_TEMP/assets/SHA256SUMS"
          printf 'zip_hash=%s\nbuild_attempt=%s\n' "$digest" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          (
            cd "$RUNNER_TEMP/assets"
            printf 'hashes<<ASSET_HASHES\n'
            sha256sum -- SHA256SUMS "book-props-$TAG.spdx.json" "book-props-$TAG.zip"
            printf 'ASSET_HASHES\n'
          ) >> "$GITHUB_OUTPUT"

      - name: Upload the audited ZIP and SPDX
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-props-${{ steps.source.outputs.tag }}-audited-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  windows:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Check out the acceptance test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false

      - name: Install the locked acceptance tools
        run: corepack pnpm --filter @book-props/windows-acceptance... install --frozen-lockfile --ignore-scripts

      - name: Download the audited ZIP and SPDX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Verify and extract the ZIP and provision Chrome
        shell: pwsh
        env:
          TAG: ${{ needs.package.outputs.tag }}
          ZIP_HASH: ${{ needs.package.outputs.zip_hash }}
        run: |
          ./tests/e2e/large/windows-release/prepare.ps1 -AssetDirectory "$env:RUNNER_TEMP/assets" -Tag $env:TAG -Digest $env:ZIP_HASH

      - name: Check pairing and Vault writes through Chrome and Obsidian
        run: corepack pnpm verify:release:windows

      - name: Upload acceptance screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: windows-acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-props-windows-acceptance/evidence
          if-no-files-found: ignore
          retention-days: 3

  attest:
    if: github.event_name == 'push'
    needs: [package, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the audited ZIP and SPDX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Check the accepted assets for this build attempt
        env:
          ASSET_HASHES: ${{ needs.package.outputs.hashes }}
          BUILD_ATTEMPT: ${{ needs.package.outputs.build_attempt }}
        run: |
          test "$BUILD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" || {
            printf 'Re-run all jobs to attest artifacts built in this attempt.\n' >&2
            exit 1
          }
          cd "$RUNNER_TEMP/assets"
          printf '%s\n' "$ASSET_HASHES" | sha256sum --check --strict -

      - name: Attest the ZIP and SPDX with GitHub Actions
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/book-props-${{ needs.package.outputs.tag }}.zip
            ${{ runner.temp }}/assets/book-props-${{ needs.package.outputs.tag }}.spdx.json

      - name: Verify the build attestation before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ needs.package.outputs.tag }}
          COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          cd "$RUNNER_TEMP/assets"
          for asset in "book-props-$TAG.zip" "book-props-$TAG.spdx.json"; do
            gh attestation verify "$asset" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
              --source-ref "$GITHUB_REF" --source-digest "$COMMIT" --deny-self-hosted-runners \
              --format json |
              jq -e \
                --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --arg ref "$GITHUB_REF" --arg commit "$COMMIT" \
                --arg workflow "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
                --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" '
                  any(.[].verificationResult.statement.predicate;
                    .buildDefinition.buildType == "https://actions.github.io/buildtypes/workflow/v1"
                    and .buildDefinition.externalParameters.workflow ==
                      {repository: $repo, ref: $ref, path: ".github/workflows/release.yml"}
                    and any(.buildDefinition.resolvedDependencies[];
                      .uri == ("git+" + $repo + "@" + $ref) and .digest.gitCommit == $commit)
                    and .runDetails.builder.id == $workflow
                    and .runDetails.metadata.invocationId == $invocation
                  )
                '
          done

  publish:
    needs: [package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/assets

      - name: Publish only after checking the uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          COMMIT: ${{ needs.package.outputs.commit }}
          TAG_OBJECT: ${{ needs.package.outputs.tag_object }}
          ASSET_HASHES: ${{ needs.package.outputs.hashes }}
        run: |
          cd "$RUNNER_TEMP/assets"
          printf '%s\n' "$ASSET_HASHES" | sha256sum --check --strict -
          tag_ref="repos/$GH_REPO/git/ref/tags/$TAG"
          test "$(gh api "$tag_ref" --jq .object.sha)" = "$TAG_OBJECT"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq -e --arg tag "$TAG" 'flatten | all(.tag_name != $tag)' > /dev/null
          releases="repos/$GH_REPO/releases"
          draft=$(gh api --method POST "$releases" \
            -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="$TAG" \
            -F draft=true -F generate_release_notes=true)
          draft_id=$(jq -er '.id | numbers' <<< "$draft")
          upload_url=$(jq -er '.upload_url | strings' <<< "$draft")
          test "$upload_url" = "https://uploads.github.com/$releases/$draft_id/assets{?name,label}"
          upload_url=${upload_url%%\{*}
          assets=(SHA256SUMS "book-props-$TAG.spdx.json" "book-props-$TAG.zip")
          for asset in "${assets[@]}"; do
            gh api --method POST "$upload_url?name=$asset" \
              -H 'Content-Type: application/octet-stream' --input "$asset" --silent
          done
          draft=$(gh api "$releases/$draft_id")
          jq -e --arg tag "$TAG" '.draft and .tag_name == $tag' <<< "$draft" > /dev/null
          uploaded_hashes=$(jq -er '
            .assets[] | select(.state == "uploaded" and (.digest | strings | startswith("sha256:")))
            | "\(.digest | ltrimstr("sha256:"))  \(.name)"
          ' <<< "$draft")
          test "$(jq -er '.assets | length' <<< "$draft")" = "${#assets[@]}"
          diff -u <(printf '%s\n' "$ASSET_HASHES" | sort) <(printf '%s\n' "$uploaded_hashes" | sort)
          test "$(gh api "$tag_ref" --jq .object.sha)" = "$TAG_OBJECT"
          gh api --method PATCH "$releases/$draft_id" -F draft=false |
            jq -er 'select(.draft == false and .immutable == true) | .html_url'
