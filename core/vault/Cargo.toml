[package]
name = "book-props-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
unicode-normalization = "0.1"
wasm-bindgen = "=0.2.121"

[lints]
workspace = true
