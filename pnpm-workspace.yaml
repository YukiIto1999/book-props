packages:
  - contracts/*
  - libs/book-products
  - runtimes/*
  - tests/arch/medium/typescript
  - tests/e2e/large/desktop-release
  - tools/obsidian-review

# eslint-plugin-obsidianmd supports ESLint 10, but three plugins it bundles have not declared it yet.
peerDependencyRules:
  allowedVersions:
    "@microsoft/eslint-plugin-sdl>eslint": "10"
    eslint-plugin-import>eslint: "10"
    eslint-plugin-react>eslint: "10"

allowBuilds:
  classic-level: false
  nx: true

minimumReleaseAgeExclude:
  - "@oxlint-tsgolint/darwin-arm64@7.0.2004"
  - "@oxlint-tsgolint/darwin-x64@7.0.2004"
  - "@oxlint-tsgolint/linux-arm64@7.0.2004"
  - "@oxlint-tsgolint/linux-x64@7.0.2004"
  - "@oxlint-tsgolint/win32-arm64@7.0.2004"
  - "@oxlint-tsgolint/win32-x64@7.0.2004"
  - oxlint-tsgolint@7.0.2004
