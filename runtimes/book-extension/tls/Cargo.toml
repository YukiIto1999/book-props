[package]
name = "book-props-browser-tls"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.16.0", features = ["web"] }
wasm-bindgen = "=0.2.121"

[lints]
workspace = true
