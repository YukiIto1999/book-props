<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Props – 接続設定</title>
  <link rel="stylesheet" href="ui.css" />
  <body class="options">
    <main>
      <h1>Book Props – 接続設定</h1>
      <p>
        Obsidian の Book Props 設定で書籍フォルダとこの拡張の ID を指定します。 Obsidian
        が表示する接続用フォルダだけを選んでください。
      </p>
      <p>この拡張のID: <code id="extension-id"></code></p>
      <div class="controls">
        <button id="pair" type="button">接続用フォルダを選ぶ</button>
        <button id="allow" type="button" hidden>今後も自動で接続する</button>
        <button id="disconnect" type="button">この Chrome の接続を解除</button>
      </div>
      <p id="status" role="status"></p>
      <h2>対応サイト</h2>
      <ul id="sites"></ul>
    </main>
    <script src="options.js"></script>
  </body>
</html>
