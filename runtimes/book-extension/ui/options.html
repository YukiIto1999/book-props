<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Props – 接続設定</title>
  <link rel="stylesheet" href="ui.css" />
  <body class="options">
    <main>
      <h1>Book Props – 接続設定</h1>
      <p>
        Obsidian の Book Props 設定で書籍フォルダとこの拡張の ID
        を指定し、発行したペアリング情報をここに貼り付けてください。
      </p>
      <p>この拡張のID: <code id="extension-id"></code></p>
      <form>
        <label for="pairing">ペアリング情報</label>
        <textarea
          id="pairing"
          autocomplete="off"
          spellcheck="false"
          maxlength="2048"
          rows="3"
          required
        ></textarea>
        <div class="controls">
          <button type="submit">ペアリング</button
          ><button id="disconnect" type="button">このChromeの接続を解除</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <h2>対応サイト</h2>
      <ul id="sites"></ul>
    </main>
    <script src="options.js"></script>
  </body>
</html>
