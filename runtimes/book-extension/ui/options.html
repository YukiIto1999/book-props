<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Props – 接続設定</title>
  <link rel="stylesheet" href="ui.css" />
  <body class="options">
    <main>
      <h1>Book Props – 接続設定</h1>
      <p>
        Obsidianの設定で書籍フォルダと拡張IDを指定し、表示された指紋を確認して末端証明書を信頼登録してください。
      </p>
      <p>この拡張のID: <code id="extension-id"></code></p>
      <form>
        <label
          >接続先 <input id="origin" type="url" placeholder="https://bp-….localhost:12345" required
        /></label>
        <label
          >一回限りのコード
          <input
            id="code"
            type="password"
            autocomplete="off"
            minlength="22"
            maxlength="22"
            required
        /></label>
        <div class="controls">
          <button type="submit">ペアリング</button
          ><button id="disconnect" type="button">このChromeの接続を解除</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <h2>対応サイト</h2>
      <ul id="sites"></ul>
    </main>
    <script src="options.js"></script>
  </body>
</html>
